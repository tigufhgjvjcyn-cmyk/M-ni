<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | CHECKMAILXTFF</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* ─── RESET & ROOT ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #a78bfa;
            --bg-primary: #0b0f14;
            --bg-card: rgba(16, 18, 27, 0.85);
            --bg-card-hover: rgba(26, 30, 45, 0.9);
            --text-primary: #ffffff;
            --text-secondary: #b0b8c4;
            --text-muted: #6b7280;
            --border-color: rgba(139, 92, 246, 0.2);
            --border-hover: rgba(139, 92, 246, 0.4);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.1);
            --glass-blur: 20px;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 270px;
            height: 100vh;
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-right: 1px solid var(--border-color);
            padding: 2rem 1.2rem;
            position: fixed;
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 100;
        }

        .sidebar-brand {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-brand .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(124, 58, 237, 0.1));
            border-radius: 50%;
            border: 1px solid var(--border-color);
            margin-bottom: 0.8rem;
            font-size: 1.5rem;
            color: var(--primary-light);
        }

        .sidebar-brand h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
        }

        .sidebar-brand p {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 0.2rem;
            letter-spacing: 1px;
        }

        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .sidebar-nav .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1.2rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            font-weight: 500;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .sidebar-nav .nav-link i {
            width: 20px;
            font-size: 1rem;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .sidebar-nav .nav-link:hover {
            background: rgba(139, 92, 246, 0.08);
            color: var(--text-primary);
        }

        .sidebar-nav .nav-link:hover i {
            color: var(--primary-light);
        }

        .sidebar-nav .nav-link.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(124, 58, 237, 0.05));
            color: var(--primary-light);
            border: 1px solid var(--border-color);
        }

        .sidebar-nav .nav-link.active i {
            color: var(--primary-light);
        }

        .sidebar-nav .nav-link .badge-nav {
            margin-left: auto;
            background: var(--primary);
            color: white;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        .sidebar-nav .nav-link.logout {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1.2rem;
            color: #f87171;
        }

        .sidebar-nav .nav-link.logout i {
            color: #f87171;
        }

        .sidebar-nav .nav-link.logout:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #fca5a5;
        }

        /* ─── MAIN CONTENT ─── */
        .main-content {
            margin-left: 270px;
            padding: 2rem 2.5rem;
            width: 100%;
            overflow-y: auto;
            height: 100vh;
        }

        /* ─── HEADER ─── */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-sm);
            border: none;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-edit {
            background: rgba(139, 92, 246, 0.15);
            color: var(--primary-light);
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
        }

        .btn-edit:hover {
            background: rgba(139, 92, 246, 0.25);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
        }

        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .btn-sm {
            padding: 0.3rem 0.7rem;
            font-size: 0.7rem;
            border-radius: 6px;
        }

        /* ─── TAB CONTENT ─── */
        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ─── STATS ─── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            opacity: 0;
            transition: var(--transition);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: var(--shadow-glow);
        }

        .stat-card .stat-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: rgba(139, 92, 246, 0.1);
            color: var(--primary-light);
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }

        .stat-card h3 {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
        }

        .stat-card p {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        .stat-card .stat-change {
            font-size: 0.75rem;
            color: #4ade80;
            margin-top: 0.3rem;
        }

        /* ─── TABLE ─── */
        .table-container {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 1rem 1.2rem;
            text-align: left;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        td .username {
            color: var(--text-primary);
            font-weight: 600;
        }

        td .sub-text {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .badge {
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-pro {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            color: white;
        }

        .badge-free {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .badge-used {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .badge-unused {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .badge-life {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        code {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            color: var(--primary-light);
        }

        /* ─── SWAL OVERRIDE ─── */
        .swal2-popup {
            background: var(--bg-card) !important;
            backdrop-filter: blur(var(--glass-blur)) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: var(--radius) !important;
            color: var(--text-primary) !important;
        }

        .swal2-title {
            color: var(--text-primary) !important;
            font-family: 'Be Vietnam Pro', sans-serif !important;
        }

        .swal2-input, .swal2-textarea, .swal2-select {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-primary) !important;
            border-radius: var(--radius-sm) !important;
            padding: 10px 14px !important;
        }

        .swal2-input:focus, .swal2-textarea:focus, .swal2-select:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15) !important;
        }

        .swal2-confirm {
            background: var(--primary) !important;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3) !important;
        }

        .swal2-cancel {
            background: rgba(255, 255, 255, 0.05) !important;
            color: var(--text-secondary) !important;
            border: 1px solid var(--border-color) !important;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 768px) {
            .sidebar {
                width: 70px;
                padding: 1rem 0.5rem;
            }

            .sidebar-brand h2,
            .sidebar-brand p,
            .sidebar-nav .nav-link span,
            .sidebar-nav .nav-link .badge-nav {
                display: none;
            }

            .sidebar-nav .nav-link {
                justify-content: center;
                padding: 0.8rem;
            }

            .sidebar-nav .nav-link i {
                font-size: 1.2rem;
                margin: 0;
            }

            .main-content {
                margin-left: 70px;
                padding: 1.2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .page-header h1 {
                font-size: 1.2rem;
            }

            th, td {
                padding: 0.6rem 0.8rem;
                font-size: 0.8rem;
            }

            .btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
            }

            .btn-sm {
                padding: 0.2rem 0.5rem;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .table-container {
                border-radius: var(--radius-sm);
            }

            table {
                font-size: 0.75rem;
            }

            th, td {
                padding: 0.5rem 0.6rem;
            }

            .actions {
                flex-direction: column;
                gap: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-brand">
            <div class="logo-icon"><i class="fas fa-user-shield"></i></div>
            <h2>Admin Panel</h2>
            <p>CHECKMAILXTFF</p>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-link active" onclick="showTab('users')">
                <i class="fas fa-users"></i>
                <span>Người dùng</span>
                <span class="badge-nav" id="userCount">0</span>
            </a>
            <a href="#" class="nav-link" onclick="showTab('keys')">
                <i class="fas fa-key"></i>
                <span>Quản lý Key</span>
                <span class="badge-nav" id="keyCount">0</span>
            </a>
            <a href="#" class="nav-link logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                <span>Đăng xuất</span>
            </a>
        </nav>
    </div>

    <div class="main-content">
        <!-- ─── USERS TAB ─── -->
        <div id="users-tab" class="tab-content active">
            <div class="page-header">
                <h1><i class="fas fa-users" style="color: var(--primary-light); margin-right: 0.5rem;"></i>Người dùng</h1>
                <div class="header-actions">
                    <button class="btn btn-outline btn-sm" onclick="loadUsers()">
                        <i class="fas fa-sync-alt"></i> Làm mới
                    </button>
                </div>
            </div>

            <div class="stats-grid" id="user-stats">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-user"></i></div>
                    <h3>Tổng User</h3>
                    <p id="stat-total">0</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-crown"></i></div>
                    <h3>User PRO</h3>
                    <p id="stat-pro">0</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fas fa-user-astronaut"></i></div>
                    <h3>User FREE</h3>
                    <p id="stat-free">0</p>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Trạng thái</th>
                            <th>Sử dụng (Ban7 / Spam)</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="users-list"></tbody>
                </table>
            </div>
        </div>

        <!-- ─── KEYS TAB ─── -->
        <div id="keys-tab" class="tab-content">
            <div class="page-header">
                <h1><i class="fas fa-key" style="color: var(--primary-light); margin-right: 0.5rem;"></i>Quản lý Key</h1>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openCreateKeyModal()">
                        <i class="fas fa-plus"></i> Tạo Key mới
                    </button>
                    <button class="btn btn-outline btn-sm" onclick="loadKeys()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Mã Key</th>
                            <th>Tính năng</th>
                            <th>Thời hạn</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="keys-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ─── TAB SWITCH ───
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tabId + '-tab').classList.add('active');
            event?.currentTarget?.classList.add('active');

            if (tabId === 'users') loadUsers();
            if (tabId === 'keys') loadKeys();
        }

        // ─── LOAD USERS ───
        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/get_users');
                const data = await res.json();
                if (data.success) {
                    const list = document.getElementById('users-list');
                    list.innerHTML = '';

                    let total = 0, proCount = 0;
                    const users = data.users || {};
                    const usages = data.usages || {};
                    const proTools = data.pro_tools || {};

                    for (const username in users) {
                        total++;
                        const user = users[username] || {};
                        const usage = usages[username] || { ban7: 0, spam_log: 0, is_pro: false };
                        const userProTools = proTools[username] || {};
                        const isPro = Boolean(user.is_pro || usage.is_pro);
                        const email = user.email || 'Chưa cập nhật';
                        const role = user.role || 'user';
                        const createdAt = user.created_at ? new Date(user.created_at).toLocaleString('vi-VN') : 'Không rõ';
                        const proToolNames = Object.keys(userProTools).length ? Object.keys(userProTools).join(', ') : '-';
                        if (isPro) proCount++;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div class="username">${user.username || username}</div>
                                <div class="sub-text">${role} · ${createdAt}</div>
                            </td>
                            <td>${email}</td>
                            <td>
                                <span class="badge ${isPro ? 'badge-pro' : 'badge-free'}">${isPro ? 'PRO' : 'FREE'}</span>
                                ${proToolNames !== '-' ? `<div class="sub-text">${proToolNames}</div>` : ''}
                            </td>
                            <td>${usage.ban7 || 0} / ${usage.spam_log || 0}</td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-edit btn-sm" onclick="editUser('${username}', '${email === 'Chưa cập nhật' ? '' : email}', ${isPro})">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-delete btn-sm" onclick="deleteUser('${username}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        `;
                        list.appendChild(tr);
                    }

                    document.getElementById('stat-total').textContent = total;
                    document.getElementById('stat-pro').textContent = proCount;
                    document.getElementById('stat-free').textContent = total - proCount;
                    document.getElementById('userCount').textContent = total;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ─── LOAD KEYS ───
        async function loadKeys() {
            try {
                const res = await fetch('/api/admin/get_keys');
                const data = await res.json();
                if (data.success) {
                    const list = document.getElementById('keys-list');
                    list.innerHTML = '';

                    const keys = data.keys || {};
                    let count = 0;

                    for (const code in keys) {
                        count++;
                        const key = keys[code];
                        const expiryDisplay = key.is_lifetime ? 'Vĩnh viễn' : (key.expiry || 'Không thời hạn');
                        const isUsed = key.is_used || false;
                        const usedBy = key.used_by || '';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td><code>${code}</code></td>
                            <td>${key.tool_name === 'all' ? 'Tất cả' : key.tool_name}</td>
                            <td><span class="badge badge-life">${expiryDisplay}</span></td>
                            <td>
                                <span class="badge ${isUsed ? 'badge-used' : 'badge-unused'}">
                                    ${isUsed ? 'Đã dùng' : 'Chưa dùng'}
                                </span>
                                ${isUsed ? `<div class="sub-text">${usedBy}</div>` : ''}
                            </td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-edit btn-sm" onclick="editKey('${code}', '${key.expiry || ''}')">
                                        <i class="fas fa-clock"></i>
                                    </button>
                                    <button class="btn btn-delete btn-sm" onclick="deleteKey('${code}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        `;
                        list.appendChild(tr);
                    }

                    document.getElementById('keyCount').textContent = count;
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ─── EDIT USER ───
        async function editUser(username, email, isPro) {
            const { value: formValues } = await Swal.fire({
                title: 'Chỉnh sửa User: ' + username,
                html: `
                    <div class="form-group" style="margin-bottom:1rem;text-align:left;">
                        <label style="color:var(--text-secondary);display:block;margin-bottom:0.3rem;font-size:0.85rem;">Email</label>
                        <input id="swal-email" class="swal2-input" value="${email}" style="width:100%;">
                    </div>
                    <div class="form-group" style="margin-bottom:1rem;text-align:left;">
                        <label style="color:var(--text-secondary);display:block;margin-bottom:0.3rem;font-size:0.85rem;">Đổi mật khẩu</label>
                        <input id="swal-pass" type="password" class="swal2-input" placeholder="Để trống nếu không đổi" style="width:100%;">
                    </div>
                    <div class="form-group" style="text-align:left;">
                        <label style="color:var(--text-secondary);display:block;margin-bottom:0.3rem;font-size:0.85rem;">Gói tài khoản</label>
                        <select id="swal-pro" class="swal2-input" style="width:100%;">
                            <option value="false" ${!isPro ? 'selected' : ''}>FREE</option>
                            <option value="true" ${isPro ? 'selected' : ''}>PRO</option>
                        </select>
                    </div>
                `,
                focusConfirm: false,
                confirmButtonText: 'Lưu thay đổi',
                preConfirm: () => ({
                    email: document.getElementById('swal-email').value,
                    password: document.getElementById('swal-pass').value,
                    is_pro: document.getElementById('swal-pro').value === 'true'
                })
            });

            if (formValues) {
                const res = await fetch('/api/admin/update_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        new_data: { email: formValues.email, is_pro: formValues.is_pro },
                        new_password: formValues.password || null
                    })
                });
                const result = await res.json();
                if (result.success) {
                    Swal.fire('Thành công', result.message, 'success');
                    loadUsers();
                }
            }
        }

        // ─── DELETE USER ───
        async function deleteUser(username) {
            const confirm = await Swal.fire({
                title: 'Xóa người dùng?',
                text: `Bạn có chắc muốn xóa user "${username}"? Hành động này không thể hoàn tác.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Xóa',
                cancelButtonText: 'Hủy'
            });

            if (confirm.isConfirmed) {
                const res = await fetch('/api/admin/delete_user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const result = await res.json();
                if (result.success) {
                    Swal.fire('Đã xóa', result.message, 'success');
                    loadUsers();
                }
            }
        }

        // ─── CREATE KEY ───
        async function openCreateKeyModal() {
            const { value: formValues } = await Swal.fire({
                title: 'Tạo Key mới',
                html: `
                    <div class="form-group" style="margin-bottom:1rem;text-align:left;">
                        <label style="color:var(--text-secondary);display:block;margin-bottom:0.3rem;font-size:0.85rem;">Tính năng</label>
                        <select id="key-tool" class="swal2-input" style="width:100%;">
                            <option value="ban7">Ban 7 Ngày</option>
                            <option value="spam_log">Spam Log</option>
                            <option value="all">Tất cả tính năng</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom:1rem;text-align:left;">
                        <label style="color:var(--text-secondary);display:block;margin-bottom:0.3rem;font-size:0.85rem;">Thời hạn</label>
                        <select id="key-type" class="swal2-input" style="width:100%;" onchange="document.getElementById('key-expiry-wrap').style.display = this.value === 'temp' ? 'block' : 'none'">
                            <option value="life">Vĩnh viễn (Lifetime)</option>
                            <option value="temp">Có thời hạn</option>
                        </select>
                    </div>
                    <div id="key-expiry-wrap" style="display:none;text-align:left;">
                        <div class="form-group">
                            <label style="color:var(--text-secondary);display:block;margin-bottom:0.3rem;font-size:0.85rem;">Ngày hết hạn</label>
                            <input id="key-expiry" class="swal2-input" placeholder="2026-12-31 23:59:59" style="width:100%;">
                        </div>
                    </div>
                `,
                confirmButtonText: 'Tạo Key',
                preConfirm: () => ({
                    tool_name: document.getElementById('key-tool').value,
                    is_lifetime: document.getElementById('key-type').value === 'life',
                    expiry: document.getElementById('key-expiry').value
                })
            });

            if (formValues) {
                const res = await fetch('/api/admin/create_key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formValues)
                });
                const result = await res.json();
                if (result.success) {
                    Swal.fire('Thành công', `Key: ${result.key}`, 'success');
                    loadKeys();
                }
            }
        }

        // ─── DELETE KEY ───
        async function deleteKey(code) {
            const confirm = await Swal.fire({
                title: 'Xóa Key?',
                text: `Bạn có chắc muốn xóa key "${code}"?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Xóa',
                cancelButtonText: 'Hủy'
            });

            if (confirm.isConfirmed) {
                const res = await fetch('/api/admin/delete_key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key_code: code })
                });
                const result = await res.json();
                if (result.success) {
                    Swal.fire('Đã xóa', result.message, 'success');
                    loadKeys();
                }
            }
        }

        // ─── LOGOUT ───
        function logout() {
            window.location.href = '/admin/login';
        }

        // ─── INIT ───
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
        });
    </script>
</body>
</html>
