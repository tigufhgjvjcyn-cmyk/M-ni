<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | CHECKMAILXTFF</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --primary-light: #a78bfa;
            --bg-primary: #0b0f14;
            --bg-card: rgba(16, 18, 27, 0.85);
            --text-primary: #ffffff;
            --text-secondary: #b0b8c4;
            --border-color: rgba(139, 92, 246, 0.25);
            --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.15);
            --glass-blur: 20px;
            --radius: 20px;
        }

        body {
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: -1;
        }

        body::before {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.20) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            animation: floatBlob 20s ease-in-out infinite;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.15) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: floatBlob 25s ease-in-out infinite reverse;
        }

        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.1); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
            pointer-events: none;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            padding: 2.5rem 2rem 2rem;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-glow), 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius);
            padding: 2px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.5), transparent 50%, rgba(167, 139, 250, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.6;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.20), rgba(124, 58, 237, 0.10));
            border-radius: 50%;
            margin-bottom: 1.2rem;
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
            transition: transform 0.3s ease;
        }

        .login-header .icon-wrapper i {
            font-size: 2rem;
            color: var(--primary-light);
        }

        .login-header h2 {
            font-family: 'Orbitron', 'Be Vietnam Pro', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .login-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
            font-size: 1rem;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .form-group .input-wrapper:focus-within i {
            opacity: 1;
            color: var(--primary-light);
        }

        .form-group input {
            width: 100%;
            padding: 14px 14px 14px 46px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Be Vietnam Pro', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
            font-size: 0.9rem;
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(16, 18, 27, 0.9) inset !important;
            -webkit-text-fill-color: var(--text-primary) !important;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 5px;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
        }

        .toggle-password:hover {
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(139, 92, 246, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn i {
            font-size: 0.9rem;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            color: #fca5a5;
            text-align: center;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .error.show {
            display: flex;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .error i {
            color: #ef4444;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .login-footer a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: var(--primary-light);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .submit-btn.loading .spinner {
            display: block;
        }
        .submit-btn.loading .btn-text {
            display: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 1.8rem 1.2rem 1.5rem;
                border-radius: 16px;
            }

            .login-header h2 {
                font-size: 1.3rem;
            }

            .login-header .icon-wrapper {
                width: 60px;
                height: 60px;
            }

            .login-header .icon-wrapper i {
                font-size: 1.5rem;
            }

            .form-group input {
                padding: 12px 12px 12px 40px;
                font-size: 0.95rem;
            }

            .submit-btn {
                padding: 13px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>
    
    <div class="login-card">
        <div class="login-header">
            <div class="icon-wrapper">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>Admin Panel</h2>
            <p>🔒 Đăng nhập để quản lý hệ thống</p>
        </div>

        <!-- Khung lỗi - Ẩn mặc định, chỉ hiện khi có lỗi từ backend -->
        <div class="error" id="errorContainer">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorMessage"></span>
        </div>

        <form method="POST" id="adminLoginForm">
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="passwordInput" placeholder="Nhập mật khẩu Admin" required autofocus>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Hiện mật khẩu">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Đăng nhập</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div class="login-footer">
            <a href="/"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
        </div>
    </div>

    <script>
        (function() {
            // --- Password Toggle ---
            const toggleBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('passwordInput');

            if (toggleBtn && passwordInput) {
                toggleBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    this.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
                });
            }

            // --- Form Submit ---
            const form = document.getElementById('adminLoginForm');
            const submitBtn = document.getElementById('submitBtn');

            if (form && submitBtn) {
                form.addEventListener('submit', function(e) {
                    const pwd = passwordInput ? passwordInput.value.trim() : '';
                    if (pwd.length > 0) {
                        submitBtn.classList.add('loading');
                        submitBtn.disabled = true;
                    }
                });
            }

            // --- Hiển thị lỗi từ backend ---
            const errorContainer = document.getElementById('errorContainer');
            const errorMessage = document.getElementById('errorMessage');

            // Lấy tham số lỗi từ URL (nếu có)
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');

            if (errorContainer && errorMessage && error) {
                errorContainer.classList.add('show');
                errorMessage.textContent = decodeURIComponent(error);
            }
        })();
    </script>
</body>
</html>
