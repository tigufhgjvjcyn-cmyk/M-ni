    <script>
        // ===== PARTICLES NETWORK =====
        const bgCanvas=document.getElementById('bgCanvas'),bgCtx=bgCanvas.getContext('2d');
        let w,h;const particles=[],MAX=35,DIST=140;
        function resize(){w=bgCanvas.width=window.innerWidth;h=bgCanvas.height=window.innerHeight}
        resize();window.addEventListener('resize',resize);
        class Particle{constructor(){this.reset()}reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.r=Math.random()*2+0.8;this.vx=(Math.random()-0.5)*0.4;this.vy=(Math.random()-0.5)*0.4;this.a=Math.random()*0.4+0.4;this.color=Math.random()<0.3?'168,85,247':'255,255,255'}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0)this.x=w;if(this.x>w)this.x=0;if(this.y<0)this.y=h;if(this.y>h)this.y=0}draw(ctx){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.a})`;ctx.fill();ctx.beginPath();ctx.arc(this.x,this.y,this.r*2.5,0,Math.PI*2);ctx.fillStyle=`rgba(${this.color},${this.a*0.2})`;ctx.fill()}}
        for(let i=0;i<MAX;i++)particles.push(new Particle());
        function drawLines(ctx){for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<DIST){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(255,255,255,${(1-d/DIST)*0.2})`;ctx.lineWidth=0.6;ctx.stroke()}}}}
        function animateBg(){bgCtx.clearRect(0,0,w,h);particles.forEach(p=>{p.update();p.draw(bgCtx)});drawLines(bgCtx);requestAnimationFrame(animateBg)}animateBg();

        // ===== TOOL STATE MANAGEMENT =====
        const toolStates = {};
        function getToolState(toolId) {
            if (!toolStates[toolId]) {
                const saved = localStorage.getItem(toolId);
                toolStates[toolId] = {
                    history: saved ? JSON.parse(saved) : [],
                    mode: 'normal'
                };
            }
            return toolStates[toolId];
        }
        function saveToolState(toolId) {
            const state = toolStates[toolId];
            if (state && state.history.length > 50) state.history = state.history.slice(-50);
            if (state) localStorage.setItem(toolId, JSON.stringify(state.history));
        }
        function addToToolHistory(toolId, item) {
            const state = getToolState(toolId);
            const exists = state.history.find(h => h.phien === item.phien);
            if (!exists) { state.history.push(item); state.history.sort((a,b)=>((parseInt(a.phien)||0)-(parseInt(b.phien)||0))); saveToolState(toolId); }
        }

        // ===== DATA =====
        const modsData=[
            {id:'getkey',name:'Getkey Game',note:'Nhận key miễn phí',icon:'🔑',iconType:'key',url:'https://vip.vnhax.top/GETKEY/gmtvipadmin'},
            {id:'lq1',name:'HACK LIÊN QUÂN CHỐNG TỐ',note:'Bản gốc, an toàn',img:'https://files.catbox.moe/3m6r1i.jpeg',url:'https://www.mediafire.com/file/se205bnwv7i7cx6/HACK_LQ+1.63.1.5.apk/file'},
            {id:'lq2',name:'HACK LIÊN QUÂN CHỐNG TỐ',note:'Bản tách gốc, áp dụng mẹo',img:'https://files.catbox.moe/3m6r1i.jpeg',url:'https://www.mediafire.com/file/ifbtpcb2hho8bqs/HACK_LQ+1.63.1.5_T%C3%81CH+G%E1%BB%90C.apk/file'},
            {id:'zs',name:'Zingspeed Mobile',note:'Game đua xe huyền thoại',img:'https://files.catbox.moe/mdw6et.jpeg',url:'https://drive.google.com/file/d/1hOHWCkZQtcmL22YvBLCpWl7EEHydKzCf/view?pli=1'},
            {id:'tc',name:'Tốc Chiến Vng',note:'Hack Map Tốc Chiến',img:'https://files.catbox.moe/i1v9yb.jpeg',url:'https://www.mediafire.com/file/ga2efoinre2eg34/Map+T%E1%BA%91c+Chi%E1%BA%BFn_7.1.0.9849.apk/file'},
            {id:'fc',name:'FC MOBILE VN 🇻🇳',note:'Hack Fc Mobile',img:'https://files.catbox.moe/ecusyo.jpeg',url:'https://www.mediafire.com/file/jq4cb8z5gq600mn/FC+27.0.07+HACK.apk/file'},
        ];
        const toolsData=[
            {id:'sunwin',name:'Sunwin',note:'Tài Xỉu & Sicbo',img:'https://files.catbox.moe/srscg8.jpeg',toolType:'sunwin'},
            {id:'hitclub',name:'HitClub',note:'Tài Xỉu, TX MD5, Sicbo',img:'https://files.catbox.moe/ur0yx4.jpeg',toolType:'hitclub'},
            {id:'789club',name:'789Club',note:'Tài Xỉu & Sicbo',img:'https://files.catbox.moe/9k6sv2.jpeg',toolType:'789club'},
        ];
        const subToolsConfig = {
            sunwin: [
                {id:'taixiu',name:'Tài Xỉu',note:'Dự đoán Tài Xỉu',img:'https://files.catbox.moe/srscg8.jpeg', toolId:'sunwin_taixiu'},
                {id:'sicbo',name:'Sicbo',note:'Dự đoán Sicbo',img:'https://files.catbox.moe/srscg8.jpeg', toolId:'sunwin_sicbo'}
            ],
            hitclub: [
                {id:'taixiu',name:'Tài Xỉu',note:'Dự đoán Tài Xỉu',img:'https://files.catbox.moe/ur0yx4.jpeg', toolId:'hitclub_taixiu'},
                {id:'taixiumd5',name:'Tài Xỉu MD5',note:'Dự đoán Tài Xỉu MD5',img:'https://files.catbox.moe/ur0yx4.jpeg', toolId:'hitclub_taixiumd5'},
                {id:'sicbo',name:'Sicbo',note:'Dự đoán Sicbo',img:'https://files.catbox.moe/ur0yx4.jpeg', toolId:'hitclub_sicbo'}
            ],
            '789club': [
                {id:'taixiu',name:'Tài Xỉu',note:'Dự đoán Tài Xỉu',img:'https://files.catbox.moe/9k6sv2.jpeg', toolId:'789club_taixiu'},
                {id:'sicbo',name:'Sicbo',note:'Dự đoán Sicbo',img:'https://files.catbox.moe/9k6sv2.jpeg', toolId:'789club_sicbo'}
            ]
        };
        let currentView='main', currentTool='';
        let activeToolId = null;
        let fetchAbortController = null;
        let fetchInterval = null;

        function clearFetchInterval() {
            if (fetchInterval) { clearInterval(fetchInterval); fetchInterval = null; }
            if (fetchAbortController) { fetchAbortController.abort(); fetchAbortController = null; }
        }

        function renderAll(){const c=document.getElementById('mainContainer');
            clearFetchInterval();
            if(currentView==='main')c.innerHTML=renderMainView();
            else if(currentView==='sunwin'||currentView==='hitclub'||currentView==='789club')c.innerHTML=renderToolMenu(currentView);
            else if(currentView.startsWith('tool_')){
                const toolId = currentView.replace('tool_','');
                activeToolId = toolId;
                c.innerHTML = renderToolView(toolTitles[toolId]||toolId);
                fetchAndUpdate(toolId);
                fetchInterval = setInterval(()=>fetchAndUpdate(toolId), 8000);
            }
        }

        function renderMainView(){return`
            <div class="card"><div class="header-row"><img src="https://files.catbox.moe/bz0rlj.jpg" class="avatar-sm" onerror="this.style.display='none'"><div class="header-info"><div class="brand">Neon Modz Team</div><div class="admin"><span class="dot"></span>telegram @Xhhdjdjdj727</div></div></div>
                <div class="bio-mini"> <strong style="color:#c084fc;">Đụ đĩ mẹ lũ Bắc kì ngu sucvat ốc lồn <strong style="color:#c084fc;">Thích gì var tao telegram </strong>@Xhhdjdjdj727</div></div>
            <div class="card"><div class="section-label">📦 Danh Mục Mod</div><div class="mods-grid">${modsData.map(m=>renderModItem(m)).join('')}</div></div>
            <div class="card"><div class="section-label">🧰 Mini Tools</div><div class="mods-grid">${toolsData.map(t=>renderToolItem(t)).join('')}</div></div>
            <div class="card"><div class="section-label">🌐 Cộng đồng</div>
                <a href="https://t.me/Xhhdjdjdj727" target="_blank" class="social-link"><div class="soc-icon yt">▶</div><div class="soc-info"><div class="soc-platform">YouTube</div><div class="soc-handle">@@Xhhdjdjdj727</div></div><span class="soc-arrow">→</span></a>
                <a href="https://t.me/Xhhdjdjdj727" target="_blank" class="social-link"><div class="soc-icon tg">✈</div><div class="soc-info"><div class="soc-platform">Telegram</div><div class="soc-handle">@Xhhdjdjdj727</div></div><span class="soc-arrow">→</span></a>
                <a href="https://t.me/Xhhdjdjdj727" target="_blank" class="social-link"><div class="soc-icon zl">Z</div><div class="soc-info"><div class="soc-platform">Zalo Group</div><div class="soc-handle">@Xhhdjdjdj727 Community</div></div><span class="soc-arrow">→</span></a>
            </div>
            <div class="footer-text">Made with <span>😜️</span> by đĩ lũ Bắc kì tuất nha Telegram @Xhhdjdjdj727`}

        function renderModItem(m){const img=m.iconType==='key'?`<div class="mod-avatar key-avatar">${m.icon}</div>`:`<img src="${m.img}" class="mod-avatar" loading="lazy">`;return`<a href="${m.url}" target="_blank" class="mod-item"><div class="mod-avatar-wrapper">${img}</div><div class="mod-title">${m.name}</div><div class="mod-note">${m.note}</div><span class="mod-download">Tải xuống →</span></a>`}
        function renderToolItem(t){return`<div class="mod-item" onclick="openTool('${t.toolType}')"><div class="mod-avatar-wrapper"><img src="${t.img}" class="mod-avatar" loading="lazy"></div><div class="mod-title">${t.name}</div><div class="mod-note">${t.note}</div><span class="mod-download">Mở Tool →</span></div>`}
        function goBack(){
            clearFetchInterval();
            if(currentView==='sunwin'||currentView==='hitclub'||currentView==='789club'){currentView='main';currentTool=''}
            else if(currentView.startsWith('tool_')){currentView=currentTool}
            renderAll()}
        function openTool(toolType){ currentTool=toolType; currentView=toolType; renderAll(); }
        function openSubTool(subId){
            clearFetchInterval();
            const config = subToolsConfig[currentTool].find(s=>s.id===subId);
            if(config){currentView='tool_'+config.toolId;renderAll()}
        }

        function renderToolMenu(tool){const titleMap={sunwin:'🎰 Sunwin',hitclub:'🎰 HitClub','789club':'🎰 789Club'};const sub=subToolsConfig[tool];return`<div class="card"><div class="back-btn" onclick="goBack()">← Quay lại</div><div class="section-label">${titleMap[tool]}</div><div class="mods-grid">${sub.map(t=>`<div class="mod-item" onclick="openSubTool('${t.id}')"><div class="mod-avatar-wrapper"><img src="${t.img}" class="mod-avatar" loading="lazy"></div><div class="mod-title">${t.name}</div><div class="mod-note">${t.note}</div><span class="mod-download">Vào →</span></div>`).join('')}</div></div>`}

        function renderToolView(title){return`<div class="card"><div class="back-btn" onclick="goBack()">← Quay lại</div><div class="section-label">${title}</div><div class="prediction-box" id="predictionBox"><div class="prediction-label">Dự đoán phiên tiếp theo</div><div class="prediction-session" id="predictionSession">Đang tải...</div><div class="prediction-result" id="predictionResult">...</div><div class="prediction-note">⚠️ Chống gãy chứa không dự đoán chính xác với tỉ lệ cao</div></div><div class="history-title">📋 Lịch sử phiên</div><div class="history-list" id="historyList"><div class="loading-text" style="text-align:center;padding:16px;color:var(--text-secondary);">Đang tải dữ liệu...</div></div></div>`}

        const toolTitles = {};
        for(const t in subToolsConfig){ subToolsConfig[t].forEach(s => { toolTitles[s.toolId] = s.name; }); }

        function parseKQ(v){if(typeof v!=='string')return null;const x=v.trim().toLowerCase();if(x==='tài'||x==='tai')return 'T';if(x==='xỉu'||x==='xiu')return 'X';return null}
        function predict(arr,mode){if(!arr||!arr.length)return{session:'???',result:'T'};const s=[...arr].sort((a,b)=>((parseInt(a.phien)||0)-(parseInt(b.phien)||0)));const last=s[s.length-1];const nid=((parseInt(last.phien)||0)+1);const sum=(parseInt(last.xuc_xac_2)||0)+(parseInt(last.tong)||0);const even=sum%2===0;const r=mode==='normal'?(even?'T':'X'):(even?'X':'T');return{session:nid.toString(),result:r}}
        function checkPrediction(actual,arr,mode){const s=[...arr].sort((a,b)=>((parseInt(a.phien)||0)-(parseInt(b.phien)||0)));if(s.length<2)return mode;const pred=predict(s.slice(0,-1),mode);if(pred.result!==parseKQ(actual)) return mode==='normal'?'reversed':'normal';return mode;}

        const apiConfig = {
            'sunwin_taixiu': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } },
            'sunwin_sicbo': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } },
            'hitclub_taixiu': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } },
            'hitclub_taixiumd5': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } },
            'hitclub_sicbo': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } },
            '789club_taixiu': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } },
            '789club_sicbo': { url: 'https://wtxmd52.tele68.com/v1/txmd5/lite-sessions?cp=R&cl=R&pf=web&at=3959701241b686f12e01bfe9c3a319b8', parse: (d)=>{ if(!d||!d.list||!d.list.length) throw new Error('No data'); const item=d.list[0]; return { phien: item.id, ket_qua: item.resultTruyenThong, tong: item.point, xuc_xac_1: item.dices?item.dices[0]:'?', xuc_xac_2: item.dices?item.dices[1]:'?', xuc_xac_3: item.dices?item.dices[2]:'?' }; } }
        };

        async function fetchAndUpdate(toolId){
            if (activeToolId !== toolId) return;
            const config = apiConfig[toolId];
            if(!config) return;
            if (fetchAbortController) fetchAbortController.abort();
            fetchAbortController = new AbortController();
            const signal = fetchAbortController.signal;

            const state = getToolState(toolId);
            try {
                const res = await fetch(config.url, { signal });
                if(!res.ok) throw new Error('HTTP '+res.status);
                const d = await res.json();
                const item = config.parse(d);
                if(!item.ket_qua) throw new Error('Missing ket_qua');
                if(state.history.length>0) state.mode = checkPrediction(item.ket_qua, state.history, state.mode);
                addToToolHistory(toolId, item);
                renderPred(predict(state.history, state.mode));
                renderHist(state.history);
            } catch (e) {
                if (e.name === 'AbortError') return;
                console.error('Fetch error '+toolId, e);
                if(state.history.length){
                    renderPred(predict(state.history, state.mode));
                    renderHist(state.history);
                } else {
                    showMaintenance();
                }
            }
        }

        function showMaintenance(){
            const b = document.getElementById('predictionBox');
            const s = document.getElementById('predictionSession');
            const r = document.getElementById('predictionResult');
            if(b){ b.className = 'prediction-box'; }
            if(s) s.textContent = '⚠️ Đang bảo trì';
            if(r){ r.textContent = '🔧'; r.className = 'prediction-maintenance'; }
        }

        function renderPred(p){
            const b = document.getElementById('predictionBox');
            const s = document.getElementById('predictionSession');
            const r = document.getElementById('predictionResult');
            if(!b||!s||!r) return;
            const t = p.result==='T';
            s.textContent = `Phiên #${p.session}`;
            r.textContent = t ? 'TÀI' : 'XỈU';
            r.className = 'prediction-result ' + (t ? 'tai' : 'xiu');
            b.className = 'prediction-box ' + (t ? 'tai-glow' : 'xiu-glow');
        }

        function renderHist(arr){
            const l = document.getElementById('historyList');
            if(!l) return;
            if(!arr.length){ l.innerHTML = '<div style="text-align:center;padding:16px;color:#8e8ea0;">Chưa có dữ liệu</div>'; return; }
            const s = [...arr].sort((a,b)=>((parseInt(b.phien)||0)-(parseInt(a.phien)||0)));
            l.innerHTML = s.map((it,i)=>{
                const k = parseKQ(it.ket_qua)||'?';
                const dice = it.xuc_xac_1 ? `${it.xuc_xac_1}-${it.xuc_xac_2}-${it.xuc_xac_3}` : '';
                const tong = it.tong ? `Tổng: ${it.tong}` : '';
                return `<div class="history-item" style="${i===0?'background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);':''}"><div><span class="history-session">#${it.phien}</span>${dice?`<span class="history-dice">🎲 ${dice}</span>`:''}${tong?`<span class="history-total">| ${tong}</span>`:''}</div><span class="history-result ${k==='T'?'tai':'xiu'}">${k==='T'?'Tài':'Xỉu'}</span></div>`;
            }).join('');
        }

        const splash=document.getElementById('splashScreen'),bgm=document.getElementById('bgMusic'),mt=document.getElementById('musicToggle');
        let mp=false;
        function enterSite(){splash.classList.add('hidden');bgm.volume=0.9;bgm.play();mp=true;mt.textContent='🎵'}
        function toggleMusic(){if(mp){bgm.pause();mp=false;mt.textContent='🔇'}else{bgm.volume=0.4;bgm.play();mp=true;mt.textContent='🎵'}}

        renderAll();
    </script>
